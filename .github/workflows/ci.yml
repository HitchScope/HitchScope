name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # `swift build`/`swift test` are disabled here: this package now
      # targets iOS 27, and hosted GitHub runners don't carry an Xcode with
      # the iOS 27 SDK yet (confirmed unavailable on macos-15 as of this
      # writing). swift-format lint doesn't need the iOS SDK - it's a
      # syntax-level tool - so it's what CI can actually check for now.
      # Real verification happens locally: `xcodebuild test -scheme
      # HitchScope -destination 'platform=iOS Simulator,name=<sim>'`
      # (plain `swift build`/`swift test` won't work either - they compile
      # for the macOS host by default, and this package is iOS-only).
      # Restore the build/test step once hosted runners support iOS 27.
      - run: swift-format lint --recursive Sources Tests --strict
